name: Validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  headers:
    name: Query headers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Validate every query header block
        run: python3 tools/validate.py

  hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: No query output committed
        run: |
          if git ls-files '*.csv' '*.tsv' 'results/*' | grep -q .; then
            echo "::error::Query output committed. Results contain tenant data — see SECURITY.md"
            git ls-files '*.csv' '*.tsv' 'results/*'
            exit 1
          fi

      - name: No tabs in query files
        run: |
          if git ls-files 'queries/*.kql' | xargs grep -Pln '\t'; then
            echo "::error::Tabs found in a .kql file. Query headers are hand-aligned with spaces."
            exit 1
          fi

      - name: No trailing whitespace in query files
        run: |
          if git ls-files 'queries/*.kql' | xargs grep -ln ' $'; then
            echo "::error::Trailing whitespace in a .kql file."
            exit 1
          fi
