name: Hygiene

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: No query output committed
        run: |
          if git ls-files '*.csv' '*.tsv' 'results/*' | grep -q .; then
            echo "::error::Query output committed. Results contain tenant data — see SECURITY.md"
            git ls-files '*.csv' '*.tsv' 'results/*'
            exit 1
          fi

      - name: No trailing whitespace in queries
        run: |
          files=$(git ls-files '*.kql')
          if [ -n "$files" ] && echo "$files" | xargs grep -ln ' $'; then
            echo "::error::Trailing whitespace in a .kql file."
            exit 1
          fi
