name: Query correction
description: A query returns the wrong answer, errors, misses events, or is too noisy
labels: ["correction"]
body:
  - type: markdown
    attributes:
      value: |
        **Redact before you post.** No real UPNs, hostnames, public IPs, tenant
        IDs or query output. A redacted example is always enough.

  - type: input
    id: query
    attributes:
      label: Which query
      description: The `QUERY:` line from the header, or the file and a line number.
      placeholder: SigninLogs — full sign-in investigation
    validations:
      required: true

  - type: dropdown
    id: kind
    attributes:
      label: What kind of problem
      options:
        - It errors and will not run
        - It runs but returns nothing when it should return something
        - It returns the wrong rows
        - It misses events it should catch
        - It is too noisy to use
        - It times out or costs too much
        - A MODIFY IT suggestion does not work
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Microsoft Sentinel
        - Defender XDR Advanced Hunting
        - Both
    validations:
      required: true

  - type: textarea
    id: what
    attributes:
      label: What happens
      description: |
        The error text, or what you got against what you expected. Paste the
        error verbatim — it usually names the column or operator at fault.
    validations:
      required: true

  - type: textarea
    id: cause
    attributes:
      label: What you think is causing it
      description: Optional. A guess is useful even when it is wrong.

  - type: textarea
    id: fix
    attributes:
      label: Suggested fix
      description: Optional. A KQL fragment is ideal.
      render: kusto

  - type: checkboxes
    id: confirm
    attributes:
      label: Before submitting
      options:
        - label: I have removed all tenant data from this issue
          required: true
